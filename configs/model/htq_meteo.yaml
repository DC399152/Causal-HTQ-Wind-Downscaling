model:
  name: meteo_gated_causal_htq_transformer
  d_model: 64
  nhead: 4
  num_encoder_layers: 2
  num_decoder_layers: 2
  dim_feedforward: 256
  dropout: 0.1
  enforce_zero_mean_residual: false

multimodal:
  use_meteo: true
  use_static: true
  fusion_type: gated_cross_attention

meteo:
  input_type: pressure_level_station
  context_hours: 6
  pressure_levels_hpa: [1000, 975, 950, 925, 900]
  num_pressure_levels: 5
  num_meteo_channels: 2
  channel_names: ["temperature", "humidity"]
  use_delta: true
  use_mask_channels: false

static:
  input_dim: 17
  n_static_tokens: 1
  encoder_type: mlp
  hidden_dim: 128
  dropout: 0.1
  feature_names:
    - LCZ_1_frac_500m
    - LCZ_2_frac_500m
    - LCZ_3_frac_500m
    - LCZ_4_frac_500m
    - LCZ_5_frac_500m
    - LCZ_6_frac_500m
    - LCZ_7_frac_500m
    - LCZ_8_frac_500m
    - LCZ_9_frac_500m
    - LCZ_10_frac_500m
    - LCZ_11_frac_500m
    - LCZ_12_frac_500m
    - LCZ_13_frac_500m
    - LCZ_14_frac_500m
    - LCZ_15_frac_500m
    - LCZ_16_frac_500m
    - LCZ_17_frac_500m

query_builder:
  type: context_conditioned
  use_temporal_context: false
  use_multiscale_trend: false
  trend_scales: [1, 3, 5]
  use_context_projection: true
  use_context_layernorm: true

fusion:
  nhead: 4
  dropout: 0.1
  gate_init_bias: -2.0

loss:
  type: standard
  lambda_l1: 1.0
  lambda_temporal: 0.2
  lambda_vertical: 0.05
